global:
  scrape_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:

  - job_name: "order-service"

    static_configs:
      - targets:
          - "order-service:8001"


  - job_name: "payment-service"

    static_configs:
      - targets:
          - "payment-service:8002"


  - job_name: "inventory-service"

    static_configs:
      - targets:
          - "inventory-service:8003"